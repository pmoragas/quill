<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: #fdfcf9; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      // Two waves and their sum, drifting over time.
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      function frame(t) {
        const w = (canvas.width = canvas.clientWidth * devicePixelRatio);
        const h = (canvas.height = canvas.clientHeight * devicePixelRatio);
        const waves = [
          { color: "#c9c4ba", f: (x) => Math.sin(x / 40 + t / 600) },
          { color: "#c9c4ba", f: (x) => 0.6 * Math.sin(x / 17 - t / 400) },
          { color: "#2b4c8c", f: (x) => Math.sin(x / 40 + t / 600) + 0.6 * Math.sin(x / 17 - t / 400) },
        ];
        for (const { color, f } of waves) {
          ctx.beginPath();
          for (let x = 0; x < w; x += 2) ctx.lineTo(x, h / 2 - (f(x / devicePixelRatio) * h) / 4);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2 * devicePixelRatio;
          ctx.stroke();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
