<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <nav id="sidebar" aria-label="Notes"><ul id="note-list"></ul></nav>

    <main id="scroller">
      <section id="welcome" class="page">
        <h1>Quill</h1>
        <p id="welcome-text"></p>
        <p><button id="open-folder" type="button">Open folder…</button></p>
        <dl class="shortcuts">
          <dt><kbd data-mod>O</kbd></dt><dd>Open a folder of notes</dd>
          <dt><kbd data-mod>P</kbd></dt><dd>Find or create a note</dd>
          <dt><kbd data-mod>E</kbd></dt><dd>Switch between reading and writing</dd>
          <dt><kbd data-mod>\</kbd></dt><dd>Show or hide the note list</dd>
          <dt><kbd data-mod>⇧ F</kbd></dt><dd>Focus mode</dd>
        </dl>
      </section>
      <article id="doc" class="page" hidden></article>
      <div id="editor" class="page" hidden></div>
    </main>

    <div id="switcher" hidden>
      <input type="text" placeholder="Find or create a note…" spellcheck="false" autocomplete="off" />
      <ul></ul>
    </div>

    <div id="toast" role="status" hidden></div>
  </body>
</html>
