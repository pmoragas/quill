<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Window chrome (custom title bar on Windows and Linux) -->
    <div id="drag-strip" data-tauri-drag-region hidden></div>
    <div id="window-controls" hidden>
      <button id="win-min" type="button" aria-label="Minimise">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" /></svg>
      </button>
      <button id="win-max" type="button" aria-label="Maximise">
        <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
      </button>
      <button id="win-close" type="button" aria-label="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" /></svg>
      </button>
    </div>

    <div id="grip" aria-hidden="true"></div>
    <div id="pill">
      <button id="pill-list" type="button" title="Note list" aria-label="Note list">☰</button>
      <span id="pill-title"></span>
      <button id="pill-save" type="button" tabindex="-1"></button>
      <button id="pill-sync" type="button" tabindex="-1"></button>
      <span id="pill-mode" role="group" aria-label="Mode">
        <button id="pill-read" type="button">Read</button>
        <button id="pill-write" type="button">Write</button>
      </span>
      <button id="pill-help" type="button" title="All actions" aria-label="All actions">?</button>
    </div>

    <nav id="sidebar" aria-label="Notes"><ul id="note-list"></ul></nav>

    <main id="scroller">
      <section id="welcome" class="page">
        <h1>Quill</h1>
        <p id="welcome-text"></p>
        <p><button id="open-folder" type="button">Open folder…</button></p>
        <div id="recent" hidden>
          <div class="label">Recent folders</div>
          <ul></ul>
        </div>
        <div id="welcome-shortcuts" class="shortcuts"></div>
      </section>
      <article id="doc" class="page doc" hidden></article>
      <div id="editor" class="page" hidden></div>
    </main>

    <div id="switcher" hidden>
      <input type="text" spellcheck="false" autocomplete="off" />
      <ul></ul>
    </div>

    <div id="palette" hidden>
      <div class="dialog" role="dialog" aria-label="Actions">
        <input type="text" placeholder="Search actions…" spellcheck="false" autocomplete="off" />
        <ul></ul>
        <div class="footer"><span>↑↓ choose</span><span>↵ run</span><span>Esc close</span><span class="end" id="palette-hint"></span></div>
      </div>
    </div>

    <div id="folders" hidden>
      <div class="dialog" role="dialog" aria-label="Open folder">
        <label class="path"><span>Open folder</span><input type="text" spellcheck="false" autocomplete="off" /></label>
        <ul></ul>
        <div class="footer">
          <span>↑↓ choose</span><span>→ enter</span><span>← up</span><span class="target"></span>
          <span class="end" id="folders-hint"></span>
        </div>
      </div>
    </div>

    <div id="export" hidden>
      <div class="dialog" role="dialog" aria-label="Export">
        <header><span class="title"></span><span class="hint">Esc close</span></header>
        <div class="body">
          <div class="preview">
            <div class="stage"><div class="sheet"><div class="window"><div class="flow doc"></div></div></div></div>
            <div class="pager">
              <button type="button" class="prev" aria-label="Previous page">‹</button>
              <span class="page-label"></span>
              <button type="button" class="next" aria-label="Next page">›</button>
            </div>
          </div>
          <div class="settings">
            <div>
              <div class="label">Paper</div>
              <div class="chips">
                <button type="button" data-set="paper=a4">A4</button>
                <button type="button" data-set="paper=letter">Letter</button>
                <button type="button" data-set="landscape=false">Portrait</button>
                <button type="button" data-set="landscape=true">Landscape</button>
              </div>
            </div>
            <div>
              <div class="label">Margins</div>
              <div class="chips">
                <button type="button" data-set="margins=narrow">Narrow</button>
                <button type="button" data-set="margins=normal">Normal</button>
                <button type="button" data-set="margins=wide">Wide</button>
              </div>
            </div>
            <div>
              <div class="label">Options</div>
              <label class="check"><input type="checkbox" data-option="pageNumbers" />Page numbers</label>
              <label class="check"><input type="checkbox" data-option="light" />Always light theme</label>
              <label class="check"><input type="checkbox" data-option="embedsAsLinks" />Include embeds as a link</label>
            </div>
            <div class="actions">
              <span class="where"></span>
              <button type="button" class="print">Print…</button>
              <button type="button" class="save">Save PDF</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="sync-settings" hidden>
      <form class="dialog" role="dialog" aria-label="Sync settings">
        <header><span class="title">Sync settings</span><span class="hint">Esc close</span></header>
        <div class="fields">
          <label>Server address<input name="url" type="url" placeholder="https://quill-sync.example.workers.dev" spellcheck="false" autocomplete="off" /></label>
          <label>Device token<input name="token" type="password" spellcheck="false" autocomplete="off" /></label>
          <label>This device is called<input name="device" type="text" placeholder="desktop" spellcheck="false" autocomplete="off" /></label>
          <label class="check"><input name="enable" type="checkbox" /><span>Sync this folder: <b class="folder-name"></b></span></label>
          <p class="note"></p>
        </div>
        <div class="actions">
          <span class="status"></span>
          <button type="button" class="test">Test connection</button>
          <button type="button" class="stop">Stop syncing</button>
          <button type="submit" class="save">Save</button>
        </div>
      </form>
    </div>

    <div id="toast" role="status" hidden></div>
  </body>
</html>
