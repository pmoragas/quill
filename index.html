<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <nav id="sidebar" aria-label="Notes"><ul id="note-list"></ul></nav>

    <main id="scroller">
      <section id="welcome" class="page">
        <h1>Quill</h1>
        <p id="welcome-text"></p>
        <p><button id="open-folder" type="button">Open folder…</button></p>
        <div id="welcome-shortcuts" class="shortcuts"></div>
      </section>
      <article id="doc" class="page" hidden></article>
      <div id="editor" class="page" hidden></div>
    </main>

    <div id="switcher" hidden>
      <input type="text" placeholder="Find or create a note…" spellcheck="false" autocomplete="off" />
      <ul></ul>
    </div>

    <button id="actions-button" type="button" aria-label="Actions and shortcuts" title="Actions and shortcuts">?</button>

    <div id="actions" hidden>
      <div class="dialog" role="dialog" aria-label="Actions">
        <ul></ul>
      </div>
    </div>

    <div id="toast" role="status" hidden></div>
  </body>
</html>
